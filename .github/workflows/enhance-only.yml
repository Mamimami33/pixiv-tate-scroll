name: Enhance-only regression

on:
  push:
    branches:
      - feat/pixiv-enhance-only-20261111
      - feat/pixiv-current-image-inplace-20261111
      - fix/pixiv-current-image-selection-20261111
      - fix/pixiv-ios-visible-controls-diagnostics-20261111
      - fix/pixiv-cdn-403-stop-20261111
  pull_request:
    paths:
      - 'pixiv-tate-scroll.user.js'
      - 'tests/enhance-only.cjs'
      - 'tests/ai-tiling.cjs'
      - 'tests/current-image-inplace.cjs'
      - 'tests/current-ugoira-inplace.cjs'
      - 'tests/manga-visible-controls.cjs'
      - '.github/workflows/enhance-only.yml'

jobs:
  enhance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check pixiv-tate-scroll.user.js
      - name: Install local browser test driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
      - name: Synthetic enhancement regression
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node tests/enhance-only.cjs
      - name: Anime4K CNN tiled real-GPU regression
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node tests/ai-tiling.cjs
      - name: Current pixiv image in-place regression
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node tests/current-image-inplace.cjs
      - name: Current pixiv ugoira in-place regression
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node tests/current-ugoira-inplace.cjs
      - name: Manga page selection and touch diagnostic regression
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node tests/manga-visible-controls.cjs
      - name: Install WebKit for Safari-engine diagnostics
        run: npx playwright install --with-deps webkit
      - name: Safari engine mobile touch and manga selection regression
        env:
          BROWSER_ENGINE: webkit
        run: node tests/manga-visible-controls.cjs

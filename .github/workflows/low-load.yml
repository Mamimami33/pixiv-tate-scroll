name: Low-load regression checks

on:
  push:
    branches:
      - fix/pixiv-low-load-review-20261111
      - feat/local-upscale-20261111
      - feat/ugoira-motion-interpolation-20261111
      - feat/anime4k-cnn-local-20261111
  pull_request:
    paths:
      - 'pixiv-tate-scroll.user.js'
      - 'tests/request-pacing.cjs'
      - 'tests/local-upscale.cjs'
      - 'tests/ugoira-motion.cjs'
      - 'tests/anime4k-cnn.cjs'
      - 'tests/content-filter.cjs'
      - '.github/workflows/low-load.yml'

jobs:
  request-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Script syntax
        run: node --check pixiv-tate-scroll.user.js
      - name: Traffic regression
        run: node tests/request-pacing.cjs
      - name: Local upscaling regression
        run: node tests/local-upscale.cjs
      - name: Ugoira motion interpolation regression
        run: node tests/ugoira-motion.cjs
      - name: Install browser-test driver (no browser download)
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.58.2
      - name: Trained Anime4K CNN WebGL2 regression
        run: node tests/anime4k-cnn.cjs
      - name: Install Playwright UI driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
      - name: Existing content/filter UI regression (mock network)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node tests/content-filter.cjs

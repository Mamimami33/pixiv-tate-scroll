name: Verify userscript
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # existing regression test compares with historical commit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and harness unit tests
        run: |
          node --check pixiv-tate-scroll.user.js
          node --check tests/content-filter.cjs
          python -m unittest discover -s tests -p 'test_autodev*.py' -v
          git diff --check HEAD~1 HEAD
      - name: Install Playwright (CI only)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
      - name: Existing browser regression
        run: node tests/content-filter.cjs

  windows-launcher-smoke:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests on Windows
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_autodev.py' -v
      - name: Make fake npm Codex shim
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'fake-codex'
          New-Item -ItemType Directory -Force $bin | Out-Null
          Set-Content -Path (Join-Path $bin 'codex.cmd') -Value '@echo off', 'if "%~1"=="--version" (echo fake-codex 0.0.0& exit /b 0)', 'if "%~1"=="login" if "%~2"=="status" exit /b 0', 'exit /b 1' -Encoding ASCII
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Exercise doctor through Windows cmd shim
        shell: pwsh
        run: |
          python tools/autodev.py --doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
